workflow: inventory_transfer
version: 1.5
intent: INVENTORY_TRANSFER

steps:
  - check_idempotency                      # Filter trace_id / idempotency key to prevent double-processing
  - interpret_intent                       # AI: Natural Language -> Structured Intent
  - validate_policy                        # POLICY: Check RBAC, tenant scope, approval requirement, and risk score
  - resolve_resource_candidates            # AI/DOMAIN: Resolve request into candidate Resource_Instance set(s)
  - capture_concurrency_versions           # CORE: Capture expected version(s) for later optimistic-lock validation
  - resolve_ambiguity_if_needed            # AI: Ask user if candidates > 1 or confidence < 0.85
  - validate_transfer_preconditions        # DOMAIN: Check resource state, location, type, and transfer eligibility
  - calculate_uom                          # CORE: Centralized context-aware conversion math
  - resolve_allocation_and_split_strategy  # DOMAIN: Determine exactly which units/instances to move, split, or allocate
  - preview_changes                        # AI: Explain the proposed physical and financial impact
  - request_human_approval                 # HITL: Mandatory approval against the previewed state/version
  - execute_transactional_unit:            # ACID BOUNDARY
      - apply_physical_and_logical_movement # Handles relocation, splitting, merge behavior, and instance ID generation
      - write_ledger_journal               # Record the corresponding financial journal impact (Ledger Law)
      - persist_outbox_events              # Persist domain event(s) for reliable async publication
  - generate_explanation                   # AI: Human-readable summary of the completed work

constraints:
  - must_use_uom_service
  - must_use_optimistic_locking            # Validate against version(s) captured before preview/approval
  - must_be_transactional
  - must_be_idempotent
  - must_enforce_allocation_integrity      # Requested quantity == allocated quantity

allowed_allocation_strategies:
  - FIFO               # First-In, First-Out (typically by created_at)
  - LIFO               # Last-In, First-Out (typically by created_at)
  - MINIMIZE_REMNANTS  # Prefer consuming smaller rolls/batches first
  - SINGLE_SOURCE      # Prefer a single source instance over multiple splits

failure_modes:
  - resource_not_found
  - ambiguity_error
  - insufficient_inventory
  - invalid_state_transition
  - policy_denied
  - version_conflict   # Concurrency error: state/version changed after preview
  - conversion_error   # UOM service missing required conversion context or failed
  - allocation_error   # No valid allocation found under allowed strategies and constraints

rollback:
  in_transaction: database_rollback
  post_commit: compensating_transaction_if_required

events:
  - INVENTORY_TRANSFER_COMMITTED

audit_context:
  required_fields:
    - trace_id
    - tenant_id
    - affected_resource_instance_ids
    - user_id
    - approval_id
    - original_prompt
    - allocation_strategy_used